[package]
name = "gepis-dados-abertos"
version = "0.1.2"
edition = "2021"
build = "src-tauri/build.rs"

[lib]
name = "gepis_dados_abertos"
path = "src-tauri/src/lib.rs"

[[bin]]
name = "gepis-dados-abertos"
path = "src-tauri/src/main.rs"

[dependencies]
# DependÃªncias do Tauri v2 (RC - Release Candidate)
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-http = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"

# Suas dependÃªncias originais
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "gzip", "stream"] }
flate2 = "1.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zip = "2.3"
csv = "1.3"
calamine = "0.24"
polars = { version = "0.41", features = ["csv", "lazy"] }
tauri-plugin-mcp-gui = "0.1.0"
base64 = "0.22.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "time"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["formatting"] }
dotenvy = "0.15"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
